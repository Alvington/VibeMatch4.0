databases:
  - name: vibematch-db
    plan: free
    databaseName: vibematch
    user: vibematch

services:
  - type: web
    name: vibematch
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vibematch-db
          property: connectionString
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
