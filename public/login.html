<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — VibeMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body class="app-body">

<a href="index.html" class="auth-back">← back to VibeMatch</a>

<div class="auth-page">
  <div class="auth-card">
    <div class="nav-mark"><span class="dot"></span>VibeMatch</div>

    <!-- Home view: sign-up tabs (phone vs email delivery), with a link down to Log in -->
    <div id="signupView">
      <div class="eyebrow" style="margin-top:18px;">let's get you in</div>
      <h1 class="display">create your account</h1>

      <div class="channel-choice" id="signupTabs">
        <button type="button" class="channel-btn active" data-mode="signup-phone" id="tabPhone">sign up with phone</button>
        <button type="button" class="channel-btn" data-mode="signup-email" id="tabEmail">sign up with email</button>
      </div>

      <div class="field" style="margin-top:20px;">
        <label>Phone number</label>
        <input id="signupPhoneInput" type="tel" placeholder="+254700000000" />
      </div>

      <div class="field" id="signupEmailField" style="display:none;">
        <label>Email</label>
        <input id="signupEmailInput" type="email" placeholder="you@example.com" />
      </div>

      <button id="signupSendBtn" class="btn-primary btn-block">send code via SMS →</button>
      <div id="signupStatus" class="status-line"></div>

      <button class="text-link-btn" id="goToLoginBtn" style="margin-top:18px;">already have an account? log in →</button>
    </div>

    <!-- Log in with an existing account: phone + password -->
    <div id="loginView" style="display:none;">
      <button class="text-link-btn" id="backFromLogin">‹ back to sign up</button>
      <div class="eyebrow" style="margin-top:14px;">welcome back</div>
      <h1 class="display">log in</h1>
      <div class="field">
        <label>Phone number</label>
        <input id="loginPhoneInput" type="tel" placeholder="+254700000000" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="passwordInput" type="password" placeholder="••••••••" />
      </div>
      <button id="loginBtn" class="btn-primary btn-block">log in</button>
      <div id="passwordStatus" class="status-line"></div>
      <button class="text-link-btn" id="forgotPasswordBtn" style="margin-top:14px;">forgot your password?</button>
    </div>

    <!-- Only used for "no password yet" / "forgot password" - signup already
         knows its channel from the tab, so it skips straight to verification. -->
    <div id="otpChannelView" style="display:none;">
      <button class="text-link-btn" id="backFromOtpChannel">‹ back</button>
      <div class="eyebrow" style="margin-top:14px;" id="otpChannelEyebrow">verify it's you</div>
      <h1 class="display" id="otpChannelHeading">verify it's you first</h1>
      <div class="channel-choice">
        <button type="button" class="channel-btn active" id="chSmsBtn">text me a code</button>
        <button type="button" class="channel-btn" id="chEmailBtn" disabled>email me a code</button>
      </div>
      <div id="otpChannelStatus" class="status-line"></div>
    </div>

    <!-- Shared final step for every path: enter the code, set a password -->
    <div id="otpVerifyScreen" style="display:none;">
      <button class="text-link-btn" id="backFromOtpVerify">‹ back</button>
      <div class="eyebrow" style="margin-top:14px;">almost there</div>
      <h1 class="display" id="otpVerifyHeading">enter your code</h1>
      <div class="field">
        <label>6-digit code</label>
        <input id="otpInput" type="text" placeholder="123456" />
      </div>
      <div class="field">
        <label id="newPasswordLabel">Set a password</label>
        <input id="newPasswordInput" type="password" placeholder="At least 6 characters" />
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input id="confirmPasswordInput" type="password" placeholder="••••••••" />
      </div>
      <button id="verifyBtn" class="btn-primary btn-block">verify &amp; set password</button>
      <div id="verifyStatus" class="status-line"></div>
    </div>

  </div>
</div>

<script src="app.js"></script>
<script>
  if (getUserId()) window.location.href = "discover.html";

  // Carries context between views. mode is one of:
  // "signup-phone" | "signup-email" | "setup" (legacy account, no password yet) | "forgot"
  const flow = { phoneNumber: "", email: "", mode: "signup-phone", hasEmail: false };

  function showView(id) {
    ["signupView", "loginView", "otpChannelView", "otpVerifyScreen"].forEach((v) => {
      $(v).style.display = v === id ? "block" : "none";
    });
  }

  // ---- Home view: sign-up tabs ----
  function setSignupTab(mode) {
    flow.mode = mode;
    $("tabPhone").classList.toggle("active", mode === "signup-phone");
    $("tabEmail").classList.toggle("active", mode === "signup-email");
    $("signupEmailField").style.display = mode === "signup-email" ? "block" : "none";
    $("signupSendBtn").textContent = mode === "signup-email" ? "send code via email →" : "send code via SMS →";
  }
  $("tabPhone").addEventListener("click", () => setSignupTab("signup-phone"));
  $("tabEmail").addEventListener("click", () => setSignupTab("signup-email"));

  async function submitSignup() {
    const phoneNumber = $("signupPhoneInput").value.trim();
    if (!phoneNumber) return setStatus($("signupStatus"), "Enter your phone number.", "err");

    const channel = flow.mode === "signup-email" ? "email" : "sms";
    const email = $("signupEmailInput").value.trim();
    if (channel === "email" && !email) return setStatus($("signupStatus"), "Enter an email to receive the code there.", "err");

    flow.phoneNumber = phoneNumber;
    flow.email = email;
    setStatus($("signupStatus"), "Sending…");

    const res = await fetch("/api/auth/request-otp", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phoneNumber, channel, email }),
    });
    const data = await res.json();
    if (!res.ok) return setStatus($("signupStatus"), data.error || "Couldn't send a code.", "err");

    enterOtpVerify(data);
  }
  $("signupSendBtn").addEventListener("click", submitSignup);

  $("goToLoginBtn").addEventListener("click", () => {
    $("loginPhoneInput").value = $("signupPhoneInput").value;
    setStatus($("passwordStatus"), "");
    showView("loginView");
  });
  $("backFromLogin").addEventListener("click", () => showView("signupView"));

  // ---- Log in ----
  async function submitLogin() {
    const phoneNumber = $("loginPhoneInput").value.trim();
    const password = $("passwordInput").value;
    if (!phoneNumber || !password) return setStatus($("passwordStatus"), "Enter your phone number and password.", "err");

    flow.phoneNumber = phoneNumber;
    setStatus($("passwordStatus"), "");

    const res = await fetch("/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phoneNumber, password }),
    });
    const data = await res.json();
    if (res.ok) {
      setUserId(data.userId);
      window.location.href = data.profileDone ? "discover.html" : "profile.html";
    } else if (data.error === "no_password_set") {
      enterOtpChannelView("setup", data.hasEmail);
    } else {
      setStatus($("passwordStatus"), data.error || data.message || "Couldn't log in.", "err");
    }
  }
  $("loginBtn").addEventListener("click", submitLogin);
  $("passwordInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitLogin(); });

  $("forgotPasswordBtn").addEventListener("click", async () => {
    const phoneNumber = $("loginPhoneInput").value.trim();
    if (!phoneNumber) return setStatus($("passwordStatus"), "Enter your phone number first.", "err");
    flow.phoneNumber = phoneNumber;
    const res = await fetch("/api/auth/lookup", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phoneNumber }),
    });
    const data = await res.json();
    if (!data.exists) return setStatus($("passwordStatus"), "No account with that number yet.", "err");
    enterOtpChannelView("forgot", data.hasEmail);
  });

  // ---- Channel choice, only for "setup" (legacy, no password) / "forgot" ----
  // Never lets an existing account's reset code go to a client-supplied email -
  // only ever to whatever email (if any) is already on file, decided server-side.
  function enterOtpChannelView(mode, hasEmail) {
    flow.mode = mode;
    flow.hasEmail = hasEmail;
    $("otpChannelEyebrow").textContent = mode === "forgot" ? "reset your password" : "verify it's you";
    $("otpChannelHeading").textContent = mode === "forgot" ? "how should we send your reset code?" : "verify it's you first";
    $("chEmailBtn").disabled = !hasEmail;
    setStatus($("otpChannelStatus"), "");
    showView("otpChannelView");
  }

  async function requestChannelCode(channel) {
    setStatus($("otpChannelStatus"), "Sending…");
    const res = await fetch("/api/auth/request-otp", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phoneNumber: flow.phoneNumber, channel }),
    });
    const data = await res.json();
    if (!res.ok) return setStatus($("otpChannelStatus"), data.error || "Couldn't send a code.", "err");
    enterOtpVerify(data);
  }
  $("chSmsBtn").addEventListener("click", () => requestChannelCode("sms"));
  $("chEmailBtn").addEventListener("click", () => requestChannelCode("email"));
  $("backFromOtpChannel").addEventListener("click", () => showView("loginView"));

  // ---- Shared: enter code + set password ----
  function enterOtpVerify(sendResult) {
    $("otpVerifyHeading").textContent = sendResult.channel === "email" ? "enter the code we emailed you" : "enter the code we texted you";
    $("newPasswordLabel").textContent = flow.mode === "forgot" ? "New password" : "Set a password";
    $("otpInput").value = sendResult.devOtp || "";
    $("newPasswordInput").value = "";
    $("confirmPasswordInput").value = "";
    setStatus($("verifyStatus"), sendResult.devOtp ? `Dev mode — your code is ${sendResult.devOtp}` : `Code sent via ${sendResult.channel === "email" ? "email" : "SMS"} — check your inbox.`, "ok");
    showView("otpVerifyScreen");
  }

  $("backFromOtpVerify").addEventListener("click", () => {
    showView(flow.mode === "setup" || flow.mode === "forgot" ? "otpChannelView" : "signupView");
  });

  async function submitVerify() {
    const otp = $("otpInput").value.trim();
    const password = $("newPasswordInput").value;
    const confirmPassword = $("confirmPasswordInput").value;

    if (password.length < 6) return setStatus($("verifyStatus"), "Password must be at least 6 characters.", "err");
    if (password !== confirmPassword) return setStatus($("verifyStatus"), "Passwords don't match.", "err");

    setStatus($("verifyStatus"), "Verifying…");
    const res = await fetch("/api/auth/verify-otp-set-password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        phoneNumber: flow.phoneNumber, otp, password,
        email: flow.mode === "signup-email" ? flow.email : undefined,
      }),
    });
    const data = await res.json();
    if (!res.ok) return setStatus($("verifyStatus"), data.error || "Couldn't verify that code.", "err");

    setUserId(data.userId);
    window.location.href = data.profileDone ? "discover.html" : "profile.html";
  }
  $("verifyBtn").addEventListener("click", submitVerify);
  $("confirmPasswordInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitVerify(); });
</script>

</body>
</html>
