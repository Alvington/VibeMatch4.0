<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat — VibeMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body class="app-body" style="background:var(--blush);">

<div id="appNav" class="app-nav"></div>

<div class="app-main wide">
  <div class="app-head">
    <div class="eyebrow">your matches</div>
    <h1 class="display">say something worth a voice note back.</h1>
  </div>

  <div class="chat-layout">
    <div class="match-list-card" id="matchList"></div>

    <div class="chat-panel">
      <div class="chat-header" id="chatHeader">Pick a match to start chatting</div>
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-empty" id="chatEmpty">no conversation open yet</div>
      </div>
      <div class="chat-input-row" id="chatInputRow" style="display:none;">
        <div class="input-mode" id="textMode">
          <input id="chatInput" placeholder="type a message…" />
          <button id="micBtn" class="icon-btn" type="button" title="Record a voice note">🎙️</button>
          <button id="sendChatBtn">send</button>
        </div>
        <div class="input-mode" id="recordingMode" style="display:none;">
          <span class="rec-dot"></span>
          <span class="rec-timer" id="recTimer">0:00</span>
          <span class="rec-hint">recording — up to 1:00</span>
          <button id="cancelRecBtn" class="icon-btn" type="button" title="Cancel">✕</button>
          <button id="stopRecBtn" type="button">stop</button>
        </div>
        <div class="input-mode" id="reviewMode" style="display:none;">
          <audio id="reviewPlayer" controls></audio>
          <button id="discardRecBtn" class="icon-btn" type="button" title="Discard">✕</button>
          <button id="sendRecBtn" type="button">send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
  const currentUserId = requireAuth();
  renderAppNav("chat");

  let socket = null;
  let currentMatchId = null;

  function connectSocket() {
    if (socket) return;
    socket = io();
    socket.on("new_message", (msg) => {
      if (msg.matchId === currentMatchId) appendBubble(msg);
    });
    socket.on("message_error", (err) => {
      alert(err.error + (err.detail ? ": " + err.detail : ""));
    });
  }

  function formatDuration(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = Math.floor(totalSeconds % 60);
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function appendBubble(msg) {
    $("chatEmpty")?.remove();
    const mine = msg.senderId === currentUserId;
    const row = document.createElement("div");
    row.className = "chat-row" + (mine ? " me" : "");

    if (msg.audioUrl) {
      const note = document.createElement("div");
      note.className = "voice-note" + (mine ? " me" : "");
      note.innerHTML = `
        <span class="vn-icon">🎙️</span>
        <audio controls src="${msg.audioUrl}"></audio>
        ${msg.audioDurationSec ? `<span class="dur">${formatDuration(msg.audioDurationSec)}</span>` : ""}
      `;
      row.appendChild(note);
    } else {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + (mine ? "me" : "them");
      bubble.textContent = msg.content;
      row.appendChild(bubble);
    }

    $("chatScroll").appendChild(row);
    $("chatScroll").scrollTop = $("chatScroll").scrollHeight;
  }

  async function loadMatches() {
    const res = await fetch(`/api/matches/${currentUserId}`);
    const matches = await res.json();
    const list = $("matchList");

    if (!matches.length) {
      list.innerHTML = `<div class="empty-state"><div class="display" style="font-size:16px;">no matches yet</div><p style="font-size:13px;">go like a few people on Discover.</p></div>`;
      return;
    }

    list.innerHTML = "";
    for (const m of matches) {
      const item = document.createElement("div");
      item.className = "match-list-item";
      item.dataset.matchId = m.matchId;
      const initial = (m.otherUser.name || "?").trim().charAt(0).toUpperCase() || "?";
      item.innerHTML = `
        <div class="avatar-dot">${
          m.otherUser.photoUrl
            ? `<img src="${m.otherUser.photoUrl}" alt="${m.otherUser.name || "Unnamed"}" />`
            : `<span class="initial">${initial}</span>`
        }</div>
        <div>
          <div class="who">${m.otherUser.name || "Unnamed"}</div>
          <div class="when">matched ${new Date(m.createdAt).toLocaleDateString()}</div>
        </div>
      `;
      item.addEventListener("click", () => openChat(m.matchId, m.otherUser.name, m.otherUser.photoUrl));
      list.appendChild(item);
    }
  }

  async function openChat(matchId, name, photoUrl) {
    if (recordingTimerInterval) cancelRecording();
    if (reviewAudioDataUrl) discardReview();

    currentMatchId = matchId;
    connectSocket();
    socket.emit("join_match", matchId);

    document.querySelectorAll(".match-list-item").forEach((el) => {
      el.classList.toggle("active", Number(el.dataset.matchId) === matchId);
    });

    const initial = (name || "?").trim().charAt(0).toUpperCase() || "?";
    $("chatHeader").innerHTML = `
      <div class="avatar-dot">${photoUrl ? `<img src="${photoUrl}" alt="${name || "Chat"}" />` : `<span class="initial">${initial}</span>`}</div>
      <span>${name || "Chat"}</span>
    `;
    $("chatInputRow").style.display = "flex";
    $("chatScroll").innerHTML = '<div class="chat-empty">loading…</div>';

    const res = await fetch(`/api/messages/${matchId}`);
    const messages = await res.json();
    $("chatScroll").innerHTML = "";
    if (!messages.length) {
      $("chatScroll").innerHTML = '<div class="chat-empty">say hi 👋</div>';
    } else {
      messages.forEach(appendBubble);
    }
  }

  $("sendChatBtn").addEventListener("click", sendMessage);
  $("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  function sendMessage() {
    const content = $("chatInput").value.trim();
    if (!content || !currentMatchId || !socket) return;
    socket.emit("send_message", { matchId: currentMatchId, senderId: currentUserId, content });
    $("chatInput").value = "";
  }

  // ---------------------------------------------------------------------
  // Voice notes
  // ---------------------------------------------------------------------
  const MAX_RECORD_SECONDS = 60;
  const micSupported = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
  if (!micSupported) {
    $("micBtn").disabled = true;
    $("micBtn").title = "Voice notes aren't supported in this browser";
  }

  let mediaRecorder = null;
  let mediaStream = null;
  let recordedChunks = [];
  let recordingTimerInterval = null;
  let recordingElapsedSec = 0;
  let reviewAudioDataUrl = null;
  let reviewAudioDurationSec = 0;

  function showInputMode(mode) {
    $("textMode").style.display = mode === "text" ? "flex" : "none";
    $("recordingMode").style.display = mode === "recording" ? "flex" : "none";
    $("reviewMode").style.display = mode === "review" ? "flex" : "none";
  }

  function pickSupportedMimeType() {
    const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
    return candidates.find((t) => MediaRecorder.isTypeSupported(t)) || "";
  }

  async function startRecording() {
    if (!micSupported) return;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      alert("Couldn't access your microphone: " + err.message);
      return;
    }

    const mimeType = pickSupportedMimeType();
    // Low bitrate is plenty for voice and keeps the base64 payload small -
    // there's no separate file storage here, this goes straight into Postgres.
    const options = { audioBitsPerSecond: 32000, ...(mimeType ? { mimeType } : {}) };
    mediaRecorder = new MediaRecorder(mediaStream, options);
    recordedChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      mediaStream.getTracks().forEach((t) => t.stop());
      if (!recordedChunks.length) return; // cancelled before any data arrived
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
      const reader = new FileReader();
      reader.onload = () => {
        reviewAudioDataUrl = reader.result;
        reviewAudioDurationSec = recordingElapsedSec;
        $("reviewPlayer").src = reviewAudioDataUrl;
        showInputMode("review");
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start();
    recordingElapsedSec = 0;
    $("recTimer").textContent = "0:00";
    showInputMode("recording");
    recordingTimerInterval = setInterval(() => {
      recordingElapsedSec += 1;
      $("recTimer").textContent = formatDuration(recordingElapsedSec);
      if (recordingElapsedSec >= MAX_RECORD_SECONDS) stopRecording();
    }, 1000);
  }

  function stopRecording() {
    clearInterval(recordingTimerInterval);
    recordingTimerInterval = null;
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  }

  function cancelRecording() {
    clearInterval(recordingTimerInterval);
    recordingTimerInterval = null;
    recordedChunks = []; // onstop still fires, but with nothing to build a blob from
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    showInputMode("text");
  }

  function discardReview() {
    reviewAudioDataUrl = null;
    $("reviewPlayer").src = "";
    showInputMode("text");
  }

  function sendReviewedVoiceNote() {
    if (!reviewAudioDataUrl || !currentMatchId || !socket) return;
    socket.emit("send_message", {
      matchId: currentMatchId,
      senderId: currentUserId,
      audioUrl: reviewAudioDataUrl,
      audioDurationSec: reviewAudioDurationSec,
    });
    discardReview();
  }

  $("micBtn").addEventListener("click", startRecording);
  $("stopRecBtn").addEventListener("click", stopRecording);
  $("cancelRecBtn").addEventListener("click", cancelRecording);
  $("discardRecBtn").addEventListener("click", discardReview);
  $("sendRecBtn").addEventListener("click", sendReviewedVoiceNote);

  loadMatches();
</script>

</body>
</html>
